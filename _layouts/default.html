<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }}</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- CSS global -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- CSS spécifique à la page (optionnel) -->
  {% if page.css %}
  <link rel="stylesheet" href="{{ page.css | relative_url }}">
  {% endif %}

  <!-- JS global -->
  <script src="{{ '/assets/js/nuit.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/lazyload.js' | relative_url }}"></script>

  <!-- JS spécifique à la page (optionnel) -->
  {% if page.js %}
  <script src="{{ page.js | relative_url }}" defer></script>
  {% endif %}

  <!-- Favicons -->
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
</head>

<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include projets.html %}

  {% include contact.html %}

  {% include footer.html %}

</body>
</html>
