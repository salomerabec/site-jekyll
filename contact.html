---
layout: default  
title: Contact
css: /assets/css/contact.css
js: /assets/js/contact.js
---

    <div class="main-container">
        <div class="contact-form">
            <h2 style="font-size: 25px;">Un projet, une question, une opportunité ?</h2>
            <h3 style="font-style: italic;">Je réponds avec plaisir.</h3>

            <form id="contact-form">

                <div class="form-group">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-contact">
  Discutons de votre projet →
</button>

                </div>
            </form>
        </div>

        <div class="additional-content">
        <!--<img src="{{ '/assets/img/location.svg' | relative_url }}" alt="location" id="location">-->
            <p>📍 Vincennes</p> 
            <p>salome.rabec.contact@gmail.com</p>
        </div>
    </div>
